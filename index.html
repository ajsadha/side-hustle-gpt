
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Hustle Starter GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    html {
      scroll-behavior: smooth;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #050505;
      color: #fff;
    }
    @keyframes glowBorder {
      0% { border-color: #8b5cf6; box-shadow: 0 0 0 rgba(139, 92, 246, 0.2); }
      25% { border-color: #06b6d4; box-shadow: 0 0 0 rgba(6, 182, 212, 0.2); }
      50% { border-color: #10b981; box-shadow: 0 0 0 rgba(16, 185, 129, 0.2); }
      75% { border-color: #f59e0b; box-shadow: 0 0 0 rgba(245, 158, 11, 0.2); }
      100% { border-color: #ef4444; box-shadow: 0 0 0 rgba(239, 68, 68, 0.2); }
    }
    .glass, .tile {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 3px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      border-radius: 1rem;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .tile:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
      animation: glowBorder 3s linear infinite;
    }
    input[type="email"] {
      color: white;
      background-color: transparent;
    }
    input[type="email"]::placeholder {
      color: #aaa;
    }
    #popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #10b981;
      color: white;
      padding: 1rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-weight: 600;
      display: none;
      z-index: 50;
      animation: popScale 0.3s ease;
    }
    @keyframes popScale {
      from { transform: translateX(-50%) scale(0.8); opacity: 0; }
      to { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    .flash {
      animation: flashBtn 0.3s ease;
    }
    @keyframes flashBtn {
      0% { box-shadow: 0 0 0px rgba(255, 255, 255, 0.8); }
      50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
      100% { box-shadow: 0 0 0px rgba(255, 255, 255, 0.8); }
    }
  </style>
</head>
<body class="text-white">

  <div id="popup">🎉 You're in! Get ready for your weekly side hustle boost.</div>

  <!-- Email Signup Section -->
  <section id="subscribe" class="py-20 px-4 sm:px-6">
    <div class="max-w-xl mx-auto tile p-8">
      <h2 class="text-2xl sm:text-3xl font-bold mb-4 text-center">Curious What’s Trending in the Gig Economy?</h2>
      <p class="text-gray-300 text-center mb-6">Get weekly insights, real side hustle examples, and fresh ideas delivered to your inbox. No spam. Just the good stuff.</p>
      <form id="emailForm" class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <input name="email" id="emailInput" type="email" placeholder="Enter your email" required class="w-full sm:w-auto px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button id="subscribeBtn" type="submit" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-full shadow hover:bg-indigo-700 transition">Subscribe</button>
      </form>
    </div>
  </section>

  <script>
    const emailForm = document.getElementById("emailForm");
    const emailInput = document.getElementById("emailInput");
    const subscribeBtn = document.getElementById("subscribeBtn");

    emailForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const popup = document.getElementById("popup");
      popup.style.display = "block";
      subscribeBtn.classList.add("flash");

      const emailValue = emailInput.value;
      if (emailValue) {
        fetch("https://script.google.com/macros/s/AKfycbzOZHOrqzIdMOJQQJZ2KqmfmejfDvSgStKlRpOOj2OQ2IJ4D7EtS4wCxxe9_vBip4TP/exec", {
          method: "POST",
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: emailValue })
        }).then(() => {
          const end = Date.now() + 4000;
          const colors = ['#bb0000', '#ffffff'];

          (function frame() {
            confetti({
              particleCount: 2,
              angle: 60,
              spread: 55,
              origin: { x: 0 },
              colors: colors
            });
            confetti({
              particleCount: 2,
              angle: 120,
              spread: 55,
              origin: { x: 1 },
              colors: colors
            });
            if (Date.now() < end) {
              requestAnimationFrame(frame);
            }
          })();

          setTimeout(() => {
            popup.style.display = "none";
            subscribeBtn.classList.remove("flash");
            emailForm.reset();
          }, 7000);
        });
      }
    });
  </script>
</body>
</html>
